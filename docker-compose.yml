name: visionpark

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionpark}
      POSTGRES_USER: ${POSTGRES_USER:-visionpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionpark}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    environment: &backend-environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visionpark}:${POSTGRES_PASSWORD:-visionpark}@db:5432/${POSTGRES_DB:-visionpark}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-this-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOCAL_STORAGE_PATH: /app/var/media
      ALPR_PROVIDER: ${ALPR_PROVIDER:-mock}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-admin}
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:-operator}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-change-me-operator}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
        VITE_USE_MOCK_FIXTURES: ${VITE_USE_MOCK_FIXTURES:-false}
        VITE_PUBLIC_REGISTRATION_ENABLED: ${VITE_PUBLIC_REGISTRATION_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
