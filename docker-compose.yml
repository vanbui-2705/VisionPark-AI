name: visionpark

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionpark}
      POSTGRES_USER: ${POSTGRES_USER:-visionpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionpark}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: visionpark-backend
    build:
      context: ./backend
      args:
        INSTALL_REAL_ALPR: ${INSTALL_REAL_ALPR:-true}
        INSTALL_OCR: ${INSTALL_OCR:-true}
    environment: &backend-environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visionpark}:${POSTGRES_PASSWORD:-visionpark}@db:5432/${POSTGRES_DB:-visionpark}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a unique JWT_SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOCAL_STORAGE_PATH: /app/var/media
      ALPR_PROVIDER: ${ALPR_PROVIDER:-real}
      ALPR_MANIFEST_PATH: ${ALPR_MANIFEST_PATH:-models/alpr-manifest.json}
      ALPR_DEVICE: ${ALPR_DEVICE:-cpu}
      ALPR_DETECTOR_CONFIDENCE: ${ALPR_DETECTOR_CONFIDENCE:-0.25}
      ALPR_CONFIDENCE_THRESHOLD: ${ALPR_CONFIDENCE_THRESHOLD:-0.85}
      ALPR_OCR_MARGIN: ${ALPR_OCR_MARGIN:-0.08}
      ALPR_OCR_ENABLED: ${ALPR_OCR_ENABLED:-true}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      AUTO_SEED: ${AUTO_SEED:-false}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_REAL_ALPR: ${INSTALL_REAL_ALPR:-true}
        INSTALL_OCR: ${INSTALL_OCR:-true}
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend-ci:
    profiles: ["ci"]
    build:
      context: ./backend
      target: ci
      args:
        INSTALL_DEV: "true"
        INSTALL_REAL_ALPR: "false"
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend-ci:
    profiles: ["ci"]
    build:
      context: ./frontend
      target: ci
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
        VITE_PUBLIC_REGISTRATION_ENABLED: ${VITE_PUBLIC_REGISTRATION_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: visionpark_postgres_data
  media_data:
    name: visionpark_media_data
