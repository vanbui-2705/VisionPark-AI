[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpark-backend"
version = "0.1.0"
description = "VisionPark Phase 1 FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.116,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "PyJWT>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20,<2"]
dev = [
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
