name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  docker:
    name: Docker CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: visionpark-ci
      COMPOSE_FILE: docker-compose.yml:deployment/compose.ci.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate an ephemeral CI signing key
        run: |
          python - <<'PY'
          import os, secrets
          key = secrets.token_urlsafe(48)
          print('::add-mask::' + key)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('JWT_SECRET_KEY=' + key + '\n')
          PY

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify bundled model checksums
        run: python backend/scripts/verify_model_bundle.py

      - name: Build CI and runtime images
        run: docker compose --profile ci build backend-ci frontend-ci migrate backend frontend

      - name: Run backend checks in Docker
        run: docker compose --profile ci run --rm backend-ci

      - name: Run frontend checks in Docker
        run: docker compose --profile ci run --rm frontend-ci

      - name: Start runtime stack
        run: docker compose up -d --wait --wait-timeout 300 backend frontend

      - name: Verify runtime health checks
        run: |
          docker compose ps
          docker compose exec -T backend python - < backend/scripts/ci_runtime_smoke.py
          docker compose exec -T frontend wget -qO- http://127.0.0.1/health/live

      - name: Collect runtime diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150 db migrate backend frontend

      - name: Cleanup Docker stack
        if: always()
        run: docker compose --profile ci down -v --remove-orphans
